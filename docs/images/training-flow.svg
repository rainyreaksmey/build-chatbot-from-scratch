<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Chatbot training flow</title>
  <desc id="desc">Five steps show examples being tokenized, counted, scored, and saved as a model.</desc>
  <defs><linearGradient id="bg2" x1="0" x2="1" y2="1"><stop stop-color="#0a121d"/><stop offset="1" stop-color="#101d19"/></linearGradient><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#62f5b5"/></marker></defs>
  <rect width="1200" height="675" rx="32" fill="url(#bg2)"/>
  <g font-family="Arial,sans-serif">
    <text x="70" y="80" fill="#a991ff" font-size="18" font-weight="700" letter-spacing="4">MODEL TRAINING</text>
    <text x="70" y="125" fill="#effff8" font-size="34" font-weight="700">From examples to predictions</text>
    <g transform="translate(55 230)">
      <g><rect width="190" height="210" rx="22" fill="#111f27" stroke="#2f4854"/><circle cx="32" cy="32" r="16" fill="#a991ff"/><text x="32" y="38" text-anchor="middle" fill="#0b1016" font-size="16" font-weight="800">1</text><text x="24" y="85" fill="#effff8" font-size="22" font-weight="700">Examples</text><text x="24" y="120" fill="#91aaa1" font-size="15">“hello”</text><text x="24" y="148" fill="#91aaa1" font-size="15">“good morning”</text><text x="24" y="184" fill="#62f5b5" font-size="14">intent: greeting</text></g>
      <g transform="translate(225)"><rect width="190" height="210" rx="22" fill="#111f27" stroke="#2f4854"/><circle cx="32" cy="32" r="16" fill="#62f5b5"/><text x="32" y="38" text-anchor="middle" fill="#0b1016" font-size="16" font-weight="800">2</text><text x="24" y="85" fill="#effff8" font-size="22" font-weight="700">Tokenize</text><rect x="24" y="110" width="58" height="32" rx="9" fill="#19372e"/><text x="53" y="131" text-anchor="middle" fill="#62f5b5" font-size="14">good</text><rect x="91" y="110" width="76" height="32" rx="9" fill="#19372e"/><text x="129" y="131" text-anchor="middle" fill="#62f5b5" font-size="14">morning</text><text x="24" y="180" fill="#91aaa1" font-size="14">lowercase + words</text></g>
      <g transform="translate(450)"><rect width="190" height="210" rx="22" fill="#111f27" stroke="#2f4854"/><circle cx="32" cy="32" r="16" fill="#62f5b5"/><text x="32" y="38" text-anchor="middle" fill="#0b1016" font-size="16" font-weight="800">3</text><text x="24" y="85" fill="#effff8" font-size="22" font-weight="700">Count</text><text x="24" y="122" fill="#91aaa1" font-size="15">hello</text><rect x="82" y="109" width="76" height="15" rx="7" fill="#62f5b5"/><text x="24" y="158" fill="#91aaa1" font-size="15">morning</text><rect x="94" y="145" width="51" height="15" rx="7" fill="#4cc6b5"/><text x="24" y="190" fill="#91aaa1" font-size="14">words per intent</text></g>
      <g transform="translate(675)"><rect width="190" height="210" rx="22" fill="#111f27" stroke="#2f4854"/><circle cx="32" cy="32" r="16" fill="#62f5b5"/><text x="32" y="38" text-anchor="middle" fill="#0b1016" font-size="16" font-weight="800">4</text><text x="24" y="85" fill="#effff8" font-size="22" font-weight="700">Score</text><text x="24" y="122" fill="#91aaa1" font-size="15">greeting</text><text x="158" y="122" text-anchor="end" fill="#62f5b5" font-size="18" font-weight="700">82%</text><text x="24" y="158" fill="#91aaa1" font-size="15">goodbye</text><text x="158" y="158" text-anchor="end" fill="#91aaa1" font-size="18">11%</text><text x="24" y="190" fill="#91aaa1" font-size="14">normalized probability</text></g>
      <g transform="translate(900)"><rect width="190" height="210" rx="22" fill="#153c2e" stroke="#62f5b5"/><circle cx="32" cy="32" r="16" fill="#62f5b5"/><text x="32" y="38" text-anchor="middle" fill="#0b1016" font-size="16" font-weight="800">5</text><text x="24" y="85" fill="#effff8" font-size="22" font-weight="700">Save</text><path d="M57 110h76v68H57zM72 110v25h46v-25M72 160h46" fill="none" stroke="#62f5b5" stroke-width="4"/><text x="95" y="202" text-anchor="middle" fill="#b9d0c8" font-size="13">intent_model.json</text></g>
      <g stroke="#62f5b5" stroke-width="3" marker-end="url(#a2)"><path d="M195 105h20"/><path d="M420 105h20"/><path d="M645 105h20"/><path d="M870 105h20"/></g>
    </g>
    <rect x="250" y="515" width="700" height="70" rx="18" fill="#0c1718" stroke="#29433e"/>
    <text x="600" y="558" text-anchor="middle" fill="#dfeee9" font-size="20">Edit examples → retrain → test → repeat</text>
  </g>
</svg>
